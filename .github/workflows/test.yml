name: test
on: push
jobs:
  test:
    runs-on: ubuntu-22.04
    container: ryuichiueda/ubuntu22.04-ros2:latest
    steps:
      - uses: actions/checkout@v2
      - name: build and test
        run: |
          rsync -av ./ /root/ros2_ws/src/rbsys25_as2
          cd /root/ros2_ws
          bash -xv ./src/rbsys25_as2/test/test.bash /root
